<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Blue Water Rafting</title>
    <meta name="description" content="Main rafting website web page with images of rafters, description of mission, services and gear">
    <meta name="author" content="Icaro Lima">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
         <img src="images/rafting-logo.png" alt="Rafting logo with crossed padles" width="200">
         <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
         </nav>
    </header>
    <main>
        <div class="hero">
            <img src="images/hero.jpg" alt="Image of people padling on a big raft" width="600">
            <h1>Adventure Awaits</h1>
            <div class="hero-box">
                <p>
                    Unique Moments
                </p>        
                <a href="trips.html" class="book-button">Book now</a>
            </div>
        </div>       
        <section class="gallery">
                <figure>
                    <img src="images/river2.jpg" alt="people padling on a river">
                    <figcaption>Rafting</figcaption>
                </figure>
                <figure>
                    <img src="images/camping.jpg" alt="people padling on a river">
                    <figcaption>Camping</figcaption>
                </figure>
                <figure>
                    <img src="images/river.jpg" alt="people padling on a river">
                    <figcaption>Rivers</figcaption>
                </figure>
        </section>
        <section class="newsletter">
            <form>
                <fieldset>
                    <legend>Subscrime to our newsletter!</legend>
                        
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>

                    <label for="email">Email:</label>
                    <input type="text" id="email" name="email" required>

                    <button type="submit">Submit</button>
                </fieldset>
            </form>
        </section>
        <section class="purpose">
                <figure>
                    <img src="images/river3.jpg" alt="people padling on a river">
                    <p>"Our mission is to reconnect you with nature through unforgettable adventures, promoting safety, environmental stewardship, and the thrill of discovery."</p>
                </figure>
                <figure>
                    <img src="images/river1.jpg" alt="people padling on a river">
                    <p>"We provide guided rafting expeditions for all skill levels, ranging from family-friendly scenic floats to high-adrenaline technical rapids for experienced adventurers."</p>
                </figure>
                <figure>
                    <img src="images/equipment.jpg" alt="people padling on a river">
                    <p>"We combine years of professional expertise with top-tier safety equipment, ensuring your only focus is enjoying every bend of the river with complete peace of mind."</p>
                </figure>
        </section>
    </main>
    <footer>
        <p>© 2026 BLUE WATER RAFTING Icaro Lima</p>
        <nav class="socialmedia">   
            <a href="https://whatssap.com">
                <img src="images/whatsapp.svg" alt="whatsapp logo" width="50">
            </a> 
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="instagram logo" width="50">
            </a> 
            <a href="https://youtube.com">
                <img src="images/youtube.svg" alt="youtube logo" width="50">    
            </a>      
        </nav>
    </footer>
</body>

</html>
