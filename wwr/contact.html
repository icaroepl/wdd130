<main>
    <div class="contact">
        <article>
            <h3>Blue Water Rafting</h3>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </article>
    </div>

    <section class="middle">
        <div class="maps">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3135.202377629767!2d-122.07703902278688!3d38.26512217186599!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808516af083847c1%3A0xe40c43fb5f1dea2f!2sKolob%20Way%2C%20Fairfield%2C%20CA%2094534%2C%20EUA!5e0!3m2!1spt-BR!2sbr!4v1780790166203!5m2!1spt-BR!2sbr" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>

        <form>
            <div class="middle-content">
                <fieldset class="contact">
                    <legend>Contact Information</legend>
                    
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>

                    <label for="email">Email:</label>
                    <input type="text" id="email" name="email" required>
                </fieldset> 

                <div class="radio">
                    <p>Message Purpose</p>
                    <label>
                        <input type="radio" id="inquiry" name="message_purpose" value="inquiry"> General Inquiry
                    </label>
                    <label>
                        <input type="radio" id="reservation" name="message_purpose" value="reservation"> Reservation Question
                    </label>
                    <label>
                        <input type="radio" id="suggestion" name="message_purpose" value="suggestion"> Website Suggestion
                    </label>
                </div>

                <div class="message">
                    <label for="places">Message</label>
                    <textarea id="places" name="places" rows="4"></textarea>   
                </div>

                <div class="message">      
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Please Subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit">Send Message</button>
            </div>
        </form>
    </section>

    <section class="service">
        <h2>We Are Here to Serve You</h2>
        <figure>
            <img src="images/profile.png" alt="profile picture placeholder">
            <figcaption>Employee</figcaption>
        </figure>
        <figure>
            <img src="images/profile.png" alt="profile picture placeholder">
            <figcaption>Employee</figcaption>
        </figure>
        <figure>
            <img src="images/profile.png" alt="profile picture placeholder">
            <figcaption>Employee</figcaption>
        </figure>
    </section>
